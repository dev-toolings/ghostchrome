# golangci-lint v2 config.
#
# Migrated from the v1 format on 02-08-2026. The v1 pin (v1.64.8) had reached
# end of life, and its side effect was that nobody could lint locally: a v2
# binary refuses a v1 config outright, so the check only ever ran in CI.
#
# The migration deliberately keeps the EFFECTIVE ruleset of v1. v2 ships a
# newer staticcheck and a newer gosec, and both bring checks the old pin never
# ran — 27 findings, none of them a defect. Adopting them is a separate
# decision from moving off an EOL linter, and mixing the two would have buried
# the version bump under a sweep of unrelated edits. Each new check is excluded
# below WITH its reason, so the choice is visible and reversible one line at a
# time.

version: "2"

linters:
  # Default set (errcheck, govet, ineffassign, staticcheck, unused) plus these.
  enable:
    - gocritic
    - gosec
    - misspell

  settings:
    errcheck:
      exclude-functions:
        # Close on a page or a browser: the process is on its way out, and a
        # failure to close has nowhere useful to be reported.
        - (*github.com/go-rod/rod.Page).Close
        - (*github.com/go-rod/rod.Browser).Close
        - (*os.File).Close
        # Writing to stdout/stderr. A CLI that cannot print has already lost.
        - fmt.Fprintf
        - fmt.Fprint
        - fmt.Fprintln

    gocritic:
      disabled-checks:
        - exitAfterDefer
        - unlambda
        - ifElseChain
        - singleCaseSwitch

    gosec:
      excludes:
        - G104 # already covered by errcheck
        - G204 # subprocess with variable args — expected in CLI tools
        - G304 # file path from variable — expected in CLI tools
        - G306 # WriteFile perms — we intentionally use 0o644 for non-secret files
        - G401 # sha1 used for non-crypto hashing (session state key derivation)
        - G404 # math/rand used for human-simulation jitter, not security
        - G505 # sha1 import — see G401
        # ── New in the gosec that ships with v2 ──────────────────────────────
        # G703 is the taint-analysis successor of G304, and lands on the same
        # code for the same reason: `ghostchrome --user-profile <path>` takes a
        # path from the operator because that IS the feature. Excluding G304
        # while enforcing G703 would only mean the same argument gets made
        # twice.
        - G703
        # XSS via taint analysis. This tool's whole job is to put caller-
        # supplied JavaScript into a page it controls; there is no untrusted
        # boundary being crossed.
        - G705
        # filepath.Walk callbacks doing filesystem operations. Only fires in
        # test helpers walking a t.TempDir() the test itself just created.
        - G122

    misspell:
      ignore-rules:
        - vehicule
        - immobilier

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters: [staticcheck]
        text: SA1019.*Dial has been deprecated
      - linters: [staticcheck]
        path: recipes/

      # QF* are staticcheck's "quickfix" suggestions — style refactors
      # (WriteString(Sprintf(…)) → Fprintf, if-chain → tagged switch). The v1
      # pin never ran them, so enabling them here would rewrite 21 call sites
      # in files untouched by any current work. Worth doing on purpose one day;
      # not worth doing as a side effect of a version bump.
      - linters: [staticcheck]
        text: "^QF[0-9]+"

      # Test fixtures use URLs like http://user:pass@host to exercise the
      # credential-scrubbing path. Flagging those as hardcoded credentials
      # flags the test for testing the thing.
      - linters: [gosec]
        path: _test\.go
        text: G101

    paths:
      - benchmark
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
