[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostchrome"
version = "0.7.0"
description = "Python SDK for ghostchrome browser automation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ghostchrome", "browser", "automation", "cdp", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/dev-toolings/ghostchrome"

[tool.hatch.build.targets.wheel]
packages = ["ghostchrome"]

[tool.hatch.build.targets.wheel.force-include]
"ghostchrome" = "ghostchrome"
