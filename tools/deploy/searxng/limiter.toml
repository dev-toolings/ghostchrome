# Minimal limiter config so SearXNG's botdetection module stops warning about a
# missing /etc/searxng/limiter.toml. The limiter itself is disabled in
# settings.yml (server.limiter: false) : this file only silences the boot
# warning on a private instance. Uses the current botdetection.* schema (the
# legacy [real_ip] section is deprecated).
[botdetection]
# Trust only loopback; local requests then resolve via remote_addr instead of
# demanding an X-Forwarded-For header (which our client sends anyway).
trusted_proxies = ["127.0.0.1/32"]

[botdetection.ip_limit]
link_token = false
