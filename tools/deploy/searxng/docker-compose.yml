# SearXNG: self-hosted metasearch, JSON API for ghostchrome websearch.
#
# Branché sur l'infra partagée `dev-infra` : réseau externe `dev-shared-net`
# et cache sur `infra-redis` (base 3): AUCUN Redis local ajouté.
# `docker ps` d'abord pour vérifier que `infra-redis` tourne.
#
# Up:   docker compose -f tools/deploy/searxng/docker-compose.yml up -d
# Test: curl 'http://localhost:8080/search?q=anthropic&format=json' | jq '.results | length'
name: searxng

services:
  searxng:
    # DEV convenience: `latest`. En PROD, épingler un tag daté / digest
    # (https://hub.docker.com/r/searxng/searxng/tags): cf. pré-mortem PRD.
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      # Host port overridable to dodge conflicts (default 8080). Match it with
      # `websearch --searxng-url http://localhost:<port>` if you change it.
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      # Secret d'instance: override via .env (jamais commité). Le placeholder
      # ci-dessous n'est valable que pour un usage dev/perso local.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-please-change-me-dev-only}
      - SEARXNG_BASE_URL=http://localhost:8080/
      # Cache partagé sur l'infra mutualisée (base logique 3, isolée): défini
      # via valkey.url dans settings.yml (SEARXNG_REDIS_URL est déprécié).
    networks:
      - dev-shared-net
    labels:
      # Regroupement lisible dans infra-dozzle.
      dev.dozzle.group: "searxng"

networks:
  # NE PAS recréer: réseau externe fourni par la stack `dev-infra`.
  dev-shared-net:
    external: true
