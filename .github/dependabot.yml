version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor:
        update-types: [minor, patch]
    ignore:
      # fetchup v0.3+ changed fetchup.New and breaks go-rod v0.116.x.
      - dependency-name: github.com/ysmood/fetchup
        versions: [">= 0.3.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /tools/deploy/chrome
    schedule:
      interval: weekly
