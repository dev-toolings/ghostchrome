name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Smoke build & vet
        # Tests run in ci.yml on every push; release only re-checks that the
        # tag compiles cleanly. Some tests need a real browser (engine/) and
        # can't run on a stock GH runner.
        run: |
          go build ./...
          go vet ./...

      - name: Build binaries
        # CGO_ENABLED=0 forces the pure-Go net/os-user resolvers so every binary
        # is truly statically linked (no libc/ld dependency) — matching the
        # "single static Go binary" promise. Rod is pure Go, so nothing is lost.
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VER="${{ github.ref_name }}"

          # ghostchrome CLI
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VER" -o dist/ghostchrome-linux-amd64 ./cmd/ghostchrome
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w -X main.version=$VER" -o dist/ghostchrome-linux-arm64 ./cmd/ghostchrome
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VER" -o dist/ghostchrome-darwin-amd64 ./cmd/ghostchrome
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w -X main.version=$VER" -o dist/ghostchrome-darwin-arm64 ./cmd/ghostchrome
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VER" -o dist/ghostchrome-windows-amd64.exe ./cmd/ghostchrome

          # ghostchrome-mcp standalone MCP server. Keep this artifact separate
          # from the CLI: setup installs exactly one of the two binaries.
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VER" -o dist/ghostchrome-mcp-linux-amd64 ./cmd/ghostchrome-mcp
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w -X main.version=$VER" -o dist/ghostchrome-mcp-linux-arm64 ./cmd/ghostchrome-mcp
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VER" -o dist/ghostchrome-mcp-darwin-amd64 ./cmd/ghostchrome-mcp
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w -X main.version=$VER" -o dist/ghostchrome-mcp-darwin-arm64 ./cmd/ghostchrome-mcp
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VER" -o dist/ghostchrome-mcp-windows-amd64.exe ./cmd/ghostchrome-mcp

          # The skill is a client-neutral artifact, consumed by the installer
          # in both modes and copied to Claude, Codex, and Grok's global skill
          # directories. Keep the directory layout intact for references and
          # examples (SKILL.md remains the entry point).
          tar -czf dist/ghostchrome-skill.tar.gz -C .claude/skills ghostchrome

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/ghostchrome-*
            dist/checksums.txt

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Assemble & publish npm packages (@ghostchrome/cli)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish."
            exit 0
          fi
          VER="${{ github.ref_name }}"; VER="${VER#v}"   # v0.3.0 -> 0.3.0
          NPM_DIR=packages/npm

          # Copy the matching Go binary into each platform package.
          copy_bin() { mkdir -p "$NPM_DIR/$1/bin"; cp "dist/$2" "$NPM_DIR/$1/bin/$3"; chmod +x "$NPM_DIR/$1/bin/$3"; }
          copy_bin cli-linux-x64    ghostchrome-linux-amd64        ghostchrome
          copy_bin cli-linux-arm64  ghostchrome-linux-arm64        ghostchrome
          copy_bin cli-darwin-x64   ghostchrome-darwin-amd64       ghostchrome
          copy_bin cli-darwin-arm64 ghostchrome-darwin-arm64       ghostchrome
          copy_bin cli-win32-x64    ghostchrome-windows-amd64.exe  ghostchrome.exe

          # Stamp the tag version into every package.json (and the meta package's
          # optionalDependencies) so they all match the release.
          for d in cli cli-linux-x64 cli-linux-arm64 cli-darwin-x64 cli-darwin-arm64 cli-win32-x64; do
            f="$NPM_DIR/$d/package.json"; tmp=$(mktemp)
            jq --arg v "$VER" '.version=$v | (if .optionalDependencies then .optionalDependencies |= with_entries(.value=$v) else . end)' "$f" > "$tmp" && mv "$tmp" "$f"
          done

          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          # Publish platform packages first so the meta package's optional deps resolve.
          for d in cli-linux-x64 cli-linux-arm64 cli-darwin-x64 cli-darwin-arm64 cli-win32-x64 cli; do
            (cd "$NPM_DIR/$d" && bun publish --access public)
          done

      - name: Publish TypeScript SDK (@ghostchrome/sdk)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping TS SDK publish."
            exit 0
          fi
          VER="${{ github.ref_name }}"; VER="${VER#v}"
          cd sdk/typescript
          tmp=$(mktemp); jq --arg v "$VER" '.version=$v' package.json > "$tmp" && mv "$tmp" package.json
          bun install
          bun run build
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          bun publish --access public

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Publish Python SDK (ghostchrome → PyPI)
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "PYPI_TOKEN secret not set — skipping PyPI publish."
            exit 0
          fi
          VER="${{ github.ref_name }}"; VER="${VER#v}"
          cd sdk/python
          # Stamp the tag version into pyproject so the wheel matches the release.
          sed -i -E "s/^version = \".*\"/version = \"$VER\"/" pyproject.toml
          python -m pip install --upgrade build twine
          python -m build
          TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_TOKEN" python -m twine upload dist/*
